name: Evaluate submissions

on:
  push:
    branches: [main]
    paths:
      - "data/submissions/**"
      - "data/questions/**"
      - "data/feedback/**"
  workflow_dispatch:

concurrency:
  group: eval
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run submissions in CPython
        run: python scripts/run_tests.py --all
      - name: Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHETSTONE_MODEL: ${{ vars.WHETSTONE_MODEL }}
        run: python scripts/review.py
      - name: Rebuild index
        run: python scripts/build_index.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Eval: test results, feedback and index"
          git pull --rebase origin main
          git push origin HEAD:main
